# ACTIVATION CANDIDATE in protected PR; DISPATCH ONLY from verified master.
# No signing is possible merely by this file existing on a PR branch.
# Standard: standards/JM_Public_Hash_Only_Witness_Standard_v1.md
# Independent exact-head review, verified required check and human activation are mandatory.
name: JM Public Hash Witness Bootstrap - NOT PRODUCT REAL GATE
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: jm-witness-protected-master-bootstrap
  cancel-in-progress: false
jobs:
  public-hash-only-attestation:
    if: github.repository == 'olivesoup/jm-gate-witness' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout ONLY public trusted witness master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate no private input and source test suite
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "olivesoup/jm-gate-witness"
          test "$GITHUB_REF" = "refs/heads/master"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test -d witness
          python3 -m unittest discover -s tests -v
      - name: Generate PUBLIC SYNTHETIC bootstrap claim; NEVER sign product PASS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import secrets
          import uuid
          from pathlib import Path
          from witness.hash_claim import canonical_bytes, claim_digest
          claim = dict(
              schema="JM_HASH_WITNESS_V1",
              audience="olivesoup/jm-gate-witness:pet001",
              claim_id=str(uuid.uuid4()),
              run_nonce=secrets.token_urlsafe(36),
              created_at=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              source_root_sha256="0" * 64,
              output_root_sha256="0" * 64,
              host_receipt_sha256="0" * 64,
              release_set_sha256="0" * 64,
              previous_claim_sha256="0" * 64,
              sequence=1,
              claim_kind="EVIDENCE_ONLY_NOT_GATE")
          out = Path("jm-witness-bootstrap-public-hash-claim.json")
          out.write_bytes(canonical_bytes(claim))
          print("JM_WITNESS_BOOTSTRAP_SOURCE_ONLY_SHA256=" + claim_digest(claim))
          print("JM_WITNESS_REAL_HOST_GATE=BLOCK_NOT_ATTESTED")
          PY
      - name: Sigstore OIDC attest PUBLIC bootstrap claim only
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: jm-witness-bootstrap-public-hash-claim.json
      - name: Verify synthetic attestation via Sigstore identity and public timestamp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from witness.hash_claim import parse_untrusted
          claim = parse_untrusted(Path("jm-witness-bootstrap-public-hash-claim.json").read_bytes())
          assert claim["claim_kind"] == "EVIDENCE_ONLY_NOT_GATE"
          assert all(claim[k] == "0" * 64 for k in (
              "source_root_sha256", "output_root_sha256",
              "host_receipt_sha256", "release_set_sha256"))
          print("JM_WITNESS_BOOTSTRAP_PUBLIC_SYNTHETIC_ONLY")
          PY
          test "$GITHUB_REPOSITORY" = 'olivesoup/jm-gate-witness'
          test "$GITHUB_REF" = 'refs/heads/master'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          echo "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          # GitHub's signed public attestation must bind this immutable master SHA.
          success=false
          for i in 1 2 3 4 5; do
            if gh attestation verify jm-witness-bootstrap-public-hash-claim.json \
              --repo olivesoup/jm-gate-witness \
              --signer-workflow olivesoup/jm-gate-witness/.github/workflows/jm-public-hash-attest.yml \
              --signer-digest "$GITHUB_SHA" \
              --source-ref refs/heads/master \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json > verified-bootstrap-attestation.json; then
              success=true
              break
            fi
            sleep 4
          done
          test "$success" = true
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("verified-bootstrap-attestation.json").read_text())
          if not isinstance(data, list) or not data:
              raise SystemExit("JM_BOOTSTRAP_SIGSTORE_VERIFICATION_EMPTY")
          if not any(isinstance(item, dict)
                     and isinstance(item.get("verificationResult"), dict)
                     and isinstance(item["verificationResult"].get("verifiedTimestamps"), list)
                     and item["verificationResult"]["verifiedTimestamps"]
                     for item in data):
              raise SystemExit("JM_BOOTSTRAP_NO_SIGNED_PUBLIC_TRANSPARENCY_TIMESTAMP")
          print("JM_BOOTSTRAP_SIGSTORE_CRYPTO_VERIFIED_IN_SIGNER_JOB_ONLY")
          print("JM_REAL_HOST_CAS_VM_GATE=BLOCK_NOT_ATTESTED")
          PY
      - name: Publish exact public synthetic claim for external independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jm-public-synthetic-hash-claim
          path: jm-witness-bootstrap-public-hash-claim.json
          if-no-files-found: error
          retention-days: 30
      - name: Report attestation reference as NON-REAL-GATE evidence
        shell: bash
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_URL"
          echo "JM_WITNESS_SIGSTORE_BOOTSTRAP_ATTESTATION_URL=$ATTESTATION_URL"
          echo "JM_WITNESS_SIGNED_REAL_HOST_GATE=BLOCK_BOOTSTRAP_ONLY"
