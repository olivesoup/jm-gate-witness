# Public-only source CI; deliberately no signing, private checkouts, or elevated token.
name: JM Witness Policy CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jm-witness-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  witness-policy:
    name: jm-witness-policy
    if: github.repository == 'olivesoup/jm-gate-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public witness source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Public canonicalizer source checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "olivesoup/jm-gate-witness"
          test -d witness && test -d tests
          python3 -m compileall -q witness tests
          python3 -m unittest discover -s tests -v
          echo 'JM_WITNESS_POLICY_SOURCE_PASS_NOT_SIGNER_OR_REAL_GATE'
      - name: Parse solo-operator policy migration without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $PWD 'scripts/Set-JM-Witness-Solo-Ruleset.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'SOLO_RULESET_SCRIPT_SYNTAX_INVALID'
          }
          Write-Output 'SOLO_RULESET_SCRIPT_SYNTAX_OK_NOT_EXECUTED'

      - name: Parse CAS public tag ruleset migration without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $PWD 'scripts/Set-JM-Public-Nonce-CAS-Tag-Ruleset.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'CAS_TAG_RULESET_SCRIPT_SYNTAX_INVALID'
          }
          Write-Output 'CAS_TAG_RULESET_SCRIPT_SYNTAX_OK_NOT_EXECUTED'
      - name: Exercise CAS tag readback in native PowerShell StrictMode (no GitHub mutation)
        shell: pwsh
        run: |
          ./tests/Test-Cas-Tag-Ruleset-Readback.ps1
      - name: Parse CAS public synthetic race script and exercise default no-op
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD 'scripts/Test-JM-Public-CAS-SyntheticRace.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'CAS_SYNTHETIC_RACE_SCRIPT_SYNTAX_INVALID'
          }
          $output = & $path
          if ($output -cne 'CAS_RACE_NOT_ACTIVATED') {
            throw 'CAS_SYNTHETIC_RACE_DEFAULT_NOT_FAIL_CLOSED'
          }
          Write-Output 'CAS_SYNTHETIC_RACE_SCRIPT_SYNTAX_AND_NOOP_PASS_NO_GITHUB_MUTATION'
